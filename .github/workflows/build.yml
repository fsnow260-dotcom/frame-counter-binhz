name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake 3.30
        shell: pwsh
        run: |
          $url = "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath cmake-dir -Force
          $cmakeBin = (Get-ChildItem cmake-dir -Directory | Select-Object -First 1).FullName + "\bin"
          Write-Host "CMake bin: $cmakeBin"
          echo $cmakeBin >> $env:GITHUB_PATH
          & "$cmakeBin\cmake.exe" --version

      - name: Verify CMake in PATH
        shell: pwsh
        run: cmake --version

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.0.0
          target: Win64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeodeMod-Win64
          path: build/*.geode