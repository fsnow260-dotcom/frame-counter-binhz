name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022          # ← ĐÂY là thay đổi duy nhất

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.0.0
          target: Win64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeodeMod-Win64
          path: build/*.geode