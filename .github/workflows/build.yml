name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Chỉ định build cho Windows
          target: Win64
          # Đặt là true nếu bạn muốn gộp nhiều platform sau này
          combine: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaNDLPrecision-Windows
          # Lấy đường dẫn file .geode từ output của bước build
          path: ${{ steps.build.outputs.build-output }}
