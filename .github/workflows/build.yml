name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI via Scoop
        shell: pwsh
        run: |
          scoop bucket add extras
          scoop install geode-sdk-cli

      - name: Verify Geode CLI
        shell: pwsh
        run: geode --version

      - name: Install Geode SDK
        shell: pwsh
        run: geode sdk install latest

      - name: Build Mod
        shell: pwsh
        run: geode build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeodeMod-Win64
          path: build/*.geode