name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Print mod.json
        shell: pwsh
        run: |
          Write-Host "=== mod.json exists? ==="
          Test-Path mod.json
          Write-Host "=== mod.json content ==="
          Get-Content mod.json -Raw
          Write-Host "=== End ==="

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeodeMod-Win64
          path: build/*.geode