name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake 3.30
        shell: pwsh
        run: |
          $url = "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath cmake-dir -Force
          $cmakeBin = (Get-ChildItem cmake-dir -Directory | Select-Object -First 1).FullName + "\bin"
          echo $cmakeBin >> $env:GITHUB_PATH

      - name: Verify CMake
        shell: pwsh
        run: cmake --version

      - name: Download Geode CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path cli-tmp | Out-Null
          gh release download --repo geode-sdk/cli --pattern "*-win.zip" --dir cli-tmp --clobber
          $zip = Get-ChildItem cli-tmp -Filter "*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath cli-bin -Force
          $exe = Get-ChildItem cli-bin -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exe.Name -ne "geode.exe") {
            Copy-Item $exe.FullName (Join-Path $exe.DirectoryName "geode.exe") -Force
          }
          echo (Split-Path $exe.FullName -Parent) >> $env:GITHUB_PATH

      - name: Setup fake profile
        shell: pwsh
        run: |
          $profileDir = "$PWD\cli-profile"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$profileDir\sdk" | Out-Null
          echo "CLI_PROFILE=$profileDir" >> $env:GITHUB_ENV

      - name: Install SDK
        shell: pwsh
        run: geode sdk install v5.0.0

      - name: Patch GeodeFile.cmake
        shell: pwsh
        run: |
          $sdkRoot = "$env:CLI_PROFILE\sdk"
          Write-Host "Looking for GeodeFile.cmake in $sdkRoot"
          Get-ChildItem -Path $sdkRoot -Filter "GeodeFile.cmake" -Recurse | ForEach-Object {
            Write-Host "FOUND: $($_.FullName)"
            Get-Content $_.FullName | Select-Object -Skip 88 -First 15 | ForEach-Object { Write-Host "  $_" }
          }

      - name: Build
        shell: pwsh
        run: geode build

      - name: Upload
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeodeMod-Win64
          path: build/*.geode